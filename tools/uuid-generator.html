    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container tool-page">
        <h1>UUID 生成器</h1>
        <p style="color:#666;margin-bottom:20px;">批量生成UUID v4/v7，支持100个同时生成</p>
        <div class="tool-body">
            <div class="tool-ui">
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
        <label>版本:
            <select id="uuidVer" style="padding:4px 8px;border:1px solid #ddd;border-radius:4px;">
                <option value="v4">UUID v4 (随机)</option>
                <option value="v4upper">UUID v4 (大写)</option>
                <option value="v7">UUID v7 (按时间排序)</option>
                <option value="nil">Nil UUID (全零)</option>
            </select>
        </label>
        <label>数量: <input type="number" id="uuidCount" value="1" min="1" max="100" style="width:60px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;"></label>
        <button class="tool-btn" onclick="generate()">生成</button>
        <button class="tool-btn" onclick="copyAll()">复制全部</button>
    </div>
    <div style="font-size:11px;color:#888;margin-bottom:8px;">
        <span id="uuidStats"></span>
    </div>
    <textarea id="uuidOutput" readonly style="width:100%%;height:300px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;background:#f9f9f9;resize:vertical;"></textarea>
</div>
<script>
function uuidV4(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]%%16;const v=c==='x'?r:(r&0x3)|0x8;return v.toString(16);});}
function uuidV7(){
    const now=Date.now();
    const hex=now.toString(16).padStart(12,'0');
    const rand1=Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b=>b.toString(16).padStart(2,'0')).join('');
    const rand2=Array.from(crypto.getRandomValues(new Uint8Array(2))).map(b=>b.toString(16).padStart(2,'0')).join('');
    const rand3=Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b=>b.toString(16).padStart(2,'0')).join('');
    const timeMid=hex.slice(4,8);
    const timeHi=hex.slice(0,4);
    return timeHi+'-'+timeMid+'-7'+hex.slice(8)+'-8'+rand2+'-'+rand1+rand3;
}
function generate(){
    const ver=document.getElementById('uuidVer').value;
    const count=parseInt(document.getElementById('uuidCount').value)||1;
    const output=document.getElementById('uuidOutput');
    const stats=document.getElementById('uuidStats');
    const lines=[];
    for(let i=0;i<count;i++){
        let u='';
        if(ver==='v4') u=uuidV4();
        else if(ver==='v4upper') u=uuidV4().toUpperCase();
        else if(ver==='v7') u=uuidV7();
        else if(ver==='nil') u='00000000-0000-0000-0000-000000000000';
        lines.push(u);
    }
    output.value=lines.join('\n');
    stats.textContent='共 '+count+' 个UUID';
}
function copyAll(){const v=document.getElementById('uuidOutput').value;if(!v)return;navigator.clipboard.writeText(v).then(()=>alert('已复制 '+v.split('\n').length+' 个UUID!'));}
</script>
