var _gpShowCSS=false;
function toggleGP(){_gpShowCSS=!_gpShowCSS;renderGradients();}
function renderGradients(){
    var grid=document.getElementById('gpGrid');var q=document.getElementById('gpSearch').value.trim().toLowerCase();
    var filtered=q?GRADIENTS.filter(function(g){return g.name.includes(q);}):GRADIENTS;
    grid.innerHTML=filtered.map(function(g,i){
        var css='background: linear-gradient('+g.dir+', '+g.c1+', '+g.c2+');';
        return '<div style="border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #eee;transition:transform .2s;" onclick="copyGradient('+i+')" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">'+
            '<div style="height:80px;'+css+'"></div>'+
            '<div style="padding:8px;background:#fff;">'+
            '<div style="font-size:13px;font-weight:600;">'+g.name+'</div>'+
            '<div style="font-size:10px;color:#888;font-family:monospace;">'+g.c1+' / '+g.c2+'</div>'+
            (_gpShowCSS?'<div style="font-size:10px;color:#666;font-family:monospace;margin-top:4px;word-break:break-all;">'+css+'</div>':'')+
            '</div></div>';
    }).join('');
}
function copyGradient(i){
    var g=GRADIENTS[i];var css='background: linear-gradient('+g.dir+', '+g.c1+', '+g.c2+');';
    navigator.clipboard.writeText(css).then(function(){alert('已复制: '+g.name+'\n'+css);});
}
function filterGradients(){renderGradients();}
