<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container tool-page">
        <h1>HTML 实体编解码</h1>
        <p style="color:#666;margin-bottom:20px;">HTML特殊字符转义/反转义，支持全量编码</p>
        <div class="tool-body">
            <div class="tool-ui">
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="tool-btn active" onclick="setMode('encode')">编码</button>
        <button class="tool-btn" onclick="setMode('decode')">解码</button>
        <button class="tool-btn" onclick="setMode('encodeAll')">编码(所有字符)</button>
    </div>
    <textarea id="entityInput" placeholder="输入文本..." style="width:100%%;height:180px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;resize:vertical;"></textarea>
    <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;">
        <button class="tool-btn" onclick="process()">执行</button>
        <button class="tool-btn" onclick="swap()">交换上下</button>
        <button class="tool-btn" onclick="copyResult()">复制结果</button>
    </div>
    <textarea id="entityOutput" readonly placeholder="输出结果..." style="width:100%%;height:180px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;background:#f9f9f9;resize:vertical;"></textarea>
</div>
<script>
let em = 'encode';
function setMode(m){em=m;document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');}
function process(){
    const inp=document.getElementById('entityInput').value;
    let out='';
    if(em==='encode'){
        out=inp.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }else if(em==='encodeAll'){
        out=[...inp].map(c=>'&#'+c.charCodeAt(0)+';').join('');
    }else{
        const t=document.createElement('textarea');
        t.innerHTML=inp;
        out=t.value;
    }
    document.getElementById('entityOutput').value=out;
}
function swap(){const i=document.getElementById('entityInput'),o=document.getElementById('entityOutput');const t=i.value;i.value=o.value;o.value=t;}
function copyResult(){const v=document.getElementById('entityOutput').value;if(!v)return;navigator.clipboard.writeText(v).then(()=>alert('已复制!')).catch(()=>alert('复制失败'));}
</script>
