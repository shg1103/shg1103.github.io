<style>
.qr-controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.qr-controls label { font-size: 13px; font-weight: 600; }
.qr-controls select, .qr-controls input[type=color] { margin-left: 6px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 6px; }
.qr-canvas-wrap { text-align: center; padding: 30px; background: #f8f8f8; border-radius: 12px; min-height: 220px; display: flex; align-items: center; justify-content: center; }
</style>

<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container tool-page">
        <h1>QR 二维码生成器</h1>
        <p style="color:#666;margin-bottom:20px;">输入文本或URL，实时生成二维码，支持自定义尺寸和颜色</p>
        <div style="max-width:500px;">
            <div style="margin-bottom:16px;">
                <label style="font-weight:600;display:block;margin-bottom:6px;">二维码内容（文本或URL）</label>
                <textarea id="qrText" placeholder="输入要生成二维码的内容..." style="width:100%;min-height:80px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;resize:vertical;">https://shg1103.github.io</textarea>
            </div>
            <div class="qr-controls">
                <div><label>尺寸 <select id="qrSize"><option value="160">160x160</option><option value="200">200x200</option><option value="256" selected>256x256</option><option value="320">320x320</option><option value="400">400x400</option></select></label></div>
                <div><label>前景色 <input type="color" id="qrFg" value="#000000"></label></div>
                <div><label>背景色 <input type="color" id="qrBg" value="#ffffff"></label></div>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
                <button class="tool-btn" onclick="generateQR()">生成二维码</button>
                <button class="tool-btn" id="dlBtn" onclick="downloadQR()" style="display:none;background:#10b981;color:#fff;">下载 PNG</button>
            </div>
            <div id="qrContainer" class="qr-canvas-wrap">
                <span style="color:#999;">点击生成二维码按钮</span>
            </div>
        </div>
        <div style="margin:24px 0;text-align:center;">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1625872903750578" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </main>
<script>
var _qrCode = null;
function generateQR() {
    var text = document.getElementById("qrText").value.trim();
    if (!text) { alert("请输入二维码内容"); return; }
    var size = parseInt(document.getElementById("qrSize").value);
    var fg = document.getElementById("qrFg").value;
    var bg = document.getElementById("qrBg").value;
    var container = document.getElementById("qrContainer");
    container.innerHTML = "";
    _qrCode = new QRCode(container, {
        text: text,
        width: size,
        height: size,
        colorDark: fg,
        colorLight: bg,
        correctLevel: QRCode.CorrectLevel.H
    });
    document.getElementById("dlBtn").style.display = "inline-block";
}
function downloadQR() {
    var canvas = document.querySelector("#qrContainer canvas");
    if (!canvas) return;
    var link = document.createElement("a");
    link.download = "qrcode.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}
</script>
</body>
