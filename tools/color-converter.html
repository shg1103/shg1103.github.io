<div style="flex:1;min-width:260px;">

<div style="margin-top:24px;">
  <p style="font-weight:600;margin-bottom:12px;">常用颜色快速选择</p>

</div>
<script>
const presets=['#FF5733','#FF6B6B','#FF7F50','#FFA500','#FFD700','#ADFF2F','#00FA9A','#00BFFF','#6366f1','#8A2BE2','#FF69B4','#A0522D','#708090','#2F4F4F','#1a1a2e'];
const presDiv=document.getElementById('presets');
presets.forEach(c=>{const d=document.createElement('div');d.style.cssText='width:36px;height:36px;border-radius:6px;background:'+c+';cursor:pointer;border:2px solid transparent;transition:transform .15s;';d.title=c;d.onmouseenter=()=>d.style.transform='scale(1.15)';d.onmouseleave=()=>d.style.transform='scale(1)';d.onclick=()=>{document.getElementById('colorPicker').value=c;updateFromHex(c);};presDiv.appendChild(d);});
function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b};}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
function updateFromHex(hex){if(!/^#[0-9A-Fa-f]{6}$/.test(hex))return;const{r,g,b}=hexToRgb(hex);const{h,s,l}=rgbToHsl(r,g,b);document.getElementById('hexVal').value=hex.toUpperCase();document.getElementById('rgbVal').value='rgb('+r+', '+g+', '+b+')';document.getElementById('hslVal').value='hsl('+h+'deg, '+s+'%, '+l+'%)';document.getElementById('cssVar').value='--color: '+hex.toUpperCase()+'; /* rgb('+r+','+g+','+b+') */';document.getElementById('colorPreview').style.background=hex;}
document.getElementById('colorPicker').oninput=e=>updateFromHex(e.target.value);
document.getElementById('hexVal').oninput=e=>{const v=e.target.value.trim();if(/^#?[0-9A-Fa-f]{6}$/.test(v)){const hex=v.startsWith('#')?v:'#'+v;document.getElementById('colorPicker').value=hex;updateFromHex(hex);}};
function copyVal(id){const v=document.getElementById(id).value;navigator.clipboard.writeText(v).then(()=>{const btn=event.target;const old=btn.textContent;btn.textContent='已复制!';setTimeout(()=>btn.textContent=old,1500);});}
updateFromHex('#6366f1');
</script>
