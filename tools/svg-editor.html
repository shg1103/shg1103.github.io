        <h1>SVG 编辑预览</h1>
        <p style="color:#666;margin-bottom:20px;">SVG代码编辑，实时预览渲染效果</p>
        <div class="tool-body"><div class="tool-ui">
    <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
        <button class="tool-btn" onclick="renderSVG()">渲染</button>
        <button class="tool-btn" onclick="loadSVGSample()">加载示例</button>
        <button class="tool-btn" onclick="copyEl('svgCode')">复制代码</button>
        <button class="tool-btn" onclick="downloadSVG()">下载 SVG</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <textarea id="svgCode" oninput="autoSVG()" style="width:100%;height:350px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:12px;resize:vertical;background:#f8f8f8;"></textarea>
        <div id="svgPreview" style="width:100%;height:350px;border:1px solid #ddd;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fafafa;overflow:hidden;"></div>
    </div>
</div>
<script>
var _svgTimer=null;
function renderSVG(){
    var code=document.getElementById('svgCode').value;var prev=document.getElementById('svgPreview');
    if(code.trim().startsWith('<svg')){prev.innerHTML=code;}
    else{prev.innerHTML='<div style="color:#c00;">错误: 代码必须以 &lt;svg&gt; 开头</div>';}
}
function autoSVG(){clearTimeout(_svgTimer);_svgTimer=setTimeout(renderSVG,500);}
function loadSVGSample(){
    document.getElementById('svgCode').value='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">\n  <defs>\n    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">\n      <stop offset="0%" stop-color="#667eea"/>\n      <stop offset="100%" stop-color="#764ba2"/>\n    </linearGradient>\n  </defs>\n  <circle cx="100" cy="100" r="80" fill="url(#g)"/>\n  <text x="100" y="110" text-anchor="middle" fill="white" font-size="24" font-weight="bold">SVG</text>\n</svg>';
    renderSVG();
}
function downloadSVG(){
    var code=document.getElementById('svgCode').value;if(!code)return;
    var blob=new Blob([code],{type:'image/svg+xml'});var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='image.svg';a.click();URL.revokeObjectURL(url);
}
function copyEl(id){var v=document.getElementById(id).value;if(!v)return;navigator.clipboard.writeText(v).then(function(){alert('已复制!');});}
loadSVGSample();
</script></div>
