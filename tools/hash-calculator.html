// Web Crypto API 计算 hash
async function sha(algorithm, text) {
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const hashBuffer = await crypto.subtle.digest(algorithm, data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function calcHash(){
  const text=document.getElementById('hashInput').value;
  if(!text){alert('请输入文本');return;}
  const div=document.getElementById('results');
  div.innerHTML='<p style="color:#888;font-size:13px;">计算中...</p>';
  try{
    const [sha1,sha256,sha512]=await Promise.all([
      sha('SHA-1',text),sha('SHA-256',text),sha('SHA-512',text)
    ]);
    const md5val=md5(text);
