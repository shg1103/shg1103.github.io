<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container tool-page">
        <h1>User-Agent 解析器</h1>
        <p style="color:#666;margin-bottom:20px;">解析UA字符串，识别浏览器/OS/设备类型</p>
        <div class="tool-body">
            <div class="tool-ui">
    <div style="margin-bottom:12px;">
        <textarea id="uaInput" placeholder="粘贴 User-Agent 字符串..." style="width:100%%;height:80px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;resize:vertical;"></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <button class="tool-btn" onclick="parse()">解析</button>
        <button class="tool-btn" onclick="useMyUA()">使用我的 UA</button>
        <button class="tool-btn" onclick="clearUA()">清空</button>
    </div>
    <div id="uaResult" style="display:none;">
        <table style="width:100%%;border-collapse:collapse;font-size:13px;">
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;width:120px;">浏览器</td><td id="uaBrowser" style="padding:8px;border:1px solid #ddd;"></td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;">版本</td><td id="uaVersion" style="padding:8px;border:1px solid #ddd;"></td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;">操作系统</td><td id="uaOS" style="padding:8px;border:1px solid #ddd;"></td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;">设备类型</td><td id="uaDevice" style="padding:8px;border:1px solid #ddd;"></td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;">引擎</td><td id="uaEngine" style="padding:8px;border:1px solid #ddd;"></td></tr>
        </table>
    </div>
</div>
<script>
function parse(){
    const ua=document.getElementById('uaInput').value.trim();
    if(!ua) return;
    const r=document.getElementById('uaResult');
    r.style.display='block';
    document.getElementById('uaBrowser').textContent='--';
    document.getElementById('uaVersion').textContent='--';
    document.getElementById('uaOS').textContent='--';
    document.getElementById('uaDevice').textContent='--';
    document.getElementById('uaEngine').textContent='--';
    const m=ua.match(/(Edge|Edg|Chrome|Safari|Firefox|Opera|OPR|MSIE|Trident)\/?\s*(\d+\.?\d*)/i);
    if(m){
        const b=m[1].replace('Edg','Edge').replace('OPR','Opera').replace('MSIE','IE');
        document.getElementById('uaBrowser').textContent=b==='Trident'?'IE':b;
        document.getElementById('uaVersion').textContent=m[2];
    }
    const os=ua.match(/(Windows NT|Mac OS X|Android|Linux|iPhone OS|iPad|CrOS|Ubuntu|Fedora)\s*(\d+[\d._]*)?/);
    if(os){
        let osName=os[1].replace('Windows NT','Windows').replace('Mac OS X','macOS').replace('CrOS','ChromeOS').replace('iPhone OS','iOS');
        document.getElementById('uaOS').textContent=osName+(os[2]?' '+os[2]:'');
    }
    const engine=ua.match(/(Gecko|WebKit|Blink|Trident)/);
    if(engine) document.getElementById('uaEngine').textContent=engine[1];
    if(ua.includes('Mobile')||ua.includes('Android')) document.getElementById('uaDevice').textContent='移动端';
    else if(ua.includes('iPad')) document.getElementById('uaDevice').textContent='平板';
    else document.getElementById('uaDevice').textContent='桌面端';
}
function useMyUA(){document.getElementById('uaInput').value=navigator.userAgent;parse();}
function clearUA(){document.getElementById('uaInput').value='';document.getElementById('uaResult').style.display='none';}
</script>
