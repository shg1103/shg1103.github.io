<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container tool-page">
        <h1>YAML 格式化/校验</h1>
        <p style="color:#666;margin-bottom:20px;">YAML美化、压缩、JSON互转</p>
        <div class="tool-body">
            <div class="tool-ui">
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="tool-btn active" onclick="setMode('format')">格式化</button>
        <button class="tool-btn" onclick="setMode('compress')">压缩</button>
        <button class="tool-btn" onclick="setMode('tojson')">YAML to JSON</button>
        <button class="tool-btn" onclick="setMode('fromjson')">JSON to YAML</button>
    </div>
    <textarea id="yamlInput" placeholder="粘贴YAML数据..." style="width:100%%;height:200px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;resize:vertical;"></textarea>
    <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;">
        <button class="tool-btn" onclick="process()">执行</button>
        <button class="tool-btn" onclick="clearInput()">清空</button>
        <button class="tool-btn" onclick="copyResult()">复制结果</button>
    </div>
    <textarea id="yamlOutput" readonly placeholder="输出结果..." style="width:100%%;height:200px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;background:#f9f9f9;resize:vertical;"></textarea>
    <div id="yamlError" style="color:#e53e3e;margin-top:8px;display:none;"></div>
</div>
<script>
let currentMode = 'format';
function setMode(m) { currentMode=m; document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active'); }
function process() {
    const input = document.getElementById('yamlInput').value;
    const errDiv = document.getElementById('yamlError');
    errDiv.style.display = 'none';
    try {
        if (currentMode === 'format') {
            const obj = jsyaml.load(input);
            document.getElementById('yamlOutput').value = jsyaml.dump(obj, {indent:2, lineWidth:-1});
        } else if (currentMode === 'compress') {
            const obj = jsyaml.load(input);
            document.getElementById('yamlOutput').value = jsyaml.dump(obj, {indent:0, lineWidth:-1});
        } else if (currentMode === 'tojson') {
            const obj = jsyaml.load(input);
            document.getElementById('yamlOutput').value = JSON.stringify(obj, null, 2);
        } else if (currentMode === 'fromjson') {
            const obj = JSON.parse(input);
            document.getElementById('yamlOutput').value = jsyaml.dump(obj, {indent:2, lineWidth:-1});
        }
    } catch(e) {
        errDiv.textContent = '错误: ' + e.message;
        errDiv.style.display = 'block';
    }
}
function clearInput() { document.getElementById('yamlInput').value = ''; document.getElementById('yamlOutput').value = ''; }
function copyResult() {
    const v = document.getElementById('yamlOutput').value;
    if (!v) return;
    navigator.clipboard.writeText(v).then(()=>alert('已复制!')).catch(()=>alert('复制失败'));
}
</script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
