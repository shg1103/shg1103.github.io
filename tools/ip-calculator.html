        <div class="tool-body">
            <div class="tool-ui">
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
        <label style="font-size:13px;">IP地址/CIDR:
            <input type="text" id="ipInput" placeholder="e.g. 192.168.1.0/24" style="width:180px;padding:6px 10px;border:1px solid #ddd;border-radius:4px;font-family:monospace;">
        </label>
        <button class="tool-btn" onclick="calc()">计算</button>
        <button class="tool-btn" onclick="fillSample()">示例</button>
    </div>
    <div id="ipResult" style="display:none;">
        <table style="width:100%%;border-collapse:collapse;font-size:13px;">
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;">网络地址</td><td id="ipNetwork" style="padding:8px;border:1px solid #ddd;font-family:monospace;"></td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;">广播地址</td><td id="ipBroadcast" style="padding:8px;border:1px solid #ddd;font-family:monospace;"></td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;">子网掩码</td><td id="ipMask" style="padding:8px;border:1px solid #ddd;font-family:monospace;"></td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;">可用主机数</td><td id="ipHosts" style="padding:8px;border:1px solid #ddd;font-family:monospace;"></td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;">地址范围</td><td id="ipRange" style="padding:8px;border:1px solid #ddd;font-family:monospace;"></td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f0f4ff;font-weight:600;">CIDR</td><td id="ipCidr" style="padding:8px;border:1px solid #ddd;font-family:monospace;"></td></tr>
        </table>
    </div>
    <div id="ipError" style="color:#e53e3e;margin-top:10px;display:none;"></div>
</div>
<script>
function ip2int(ip){const p=ip.split('.');return ((+p[0]<<24)+(+p[1]<<16)+(+p[2]<<8)+(+p[3]))>>>0;}
function int2ip(n){return [(n>>>24),(n>>16)&255,(n>>8)&255,n&255].join('.');}
function calc(){
    const inp=document.getElementById('ipInput').value.trim();
    const err=document.getElementById('ipError');
    err.style.display='none';
    const r=document.getElementById('ipResult');
    r.style.display='none';
    try{
        const parts=inp.split('/');
        if(parts.length!==2) throw new Error('格式错误，请使用 CIDR 格式 (如 192.168.1.0/24)');
        const ip=parts[0].trim();
        const prefix=parseInt(parts[1]);
        if(prefix<0||prefix>32) throw new Error('前缀长度必须在 0-32 之间');
        const ipInt=ip2int(ip);
        const mask=~0<<(32-prefix);
        const network=(ipInt&mask)>>>0;
        const broadcast=(network|~mask)>>>0;
        const hosts=prefix>=31?0:Math.pow(2,32-prefix)-2;
        document.getElementById('ipNetwork').textContent=int2ip(network);
        document.getElementById('ipBroadcast').textContent=int2ip(broadcast);
        document.getElementById('ipMask').textContent=int2ip(mask);
        document.getElementById('ipHosts').textContent=hosts.toLocaleString();
        document.getElementById('ipRange').textContent=int2ip(network)+' ~ '+int2ip(broadcast);
        document.getElementById('ipCidr').textContent=inp;
        r.style.display='block';
    }catch(e){
        err.textContent=e.message;
        err.style.display='block';
    }
}
function fillSample(){document.getElementById('ipInput').value='192.168.1.0/24';calc();}
</script>
