<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON/CSV互转 - DevTools</title>
    <meta name="description" content="JSON与CSV格式互相转换">
    <link rel="stylesheet" href="../css/style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1625872903750578" crossorigin="anonymous"></script>
</head>
<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container">
        <div class="tool-page">
            <h1>&#128202; JSON/CSV互转</h1>
            
        <textarea id="jcInput" placeholder="输入JSON数组，如：[{\"name\":\"Alice\",\"age\":30}]"></textarea>
        <div style="display:flex;gap:10px;margin-top:12px;">
          <button onclick="jsonToCsv()">JSON → CSV</button>
          <button onclick="csvToJson()" style="background:#888;">CSV → JSON</button>
        </div>
        <pre id="jcOutput">结果将显示在这里</pre>
        <script>
        function jsonToCsv() {
          try {
            const arr = JSON.parse(document.getElementById('jcInput').value);
            if (!Array.isArray(arr)||!arr.length) { document.getElementById('jcOutput').textContent = '请输入非空JSON数组'; return; }
            const keys = Object.keys(arr[0]);
            let csv = keys.join(',') + '\n';
            arr.forEach(row => { csv += keys.map(k => '"' + String(row[k]??'').replace(/"/g,'""') + '"').join(',') + '\n'; });
            document.getElementById('jcOutput').textContent = csv;
          } catch(e) { document.getElementById('jcOutput').textContent = '错误：' + e.message; }
        }
        function csvToJson() {
          try {
            const text = document.getElementById('jcInput').value.trim();
            const lines = text.split('\n');
            const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g,''));
            const result = lines.slice(1).filter(l=>l.trim()).map(line => {
              const vals = line.split(',').map(v => v.replace(/^"|"$/g,''));
              const obj = {}; headers.forEach((h,i) => obj[h] = vals[i]??''); return obj;
            });
            document.getElementById('jcOutput').textContent = JSON.stringify(result, null, 2);
          } catch(e) { document.getElementById('jcOutput').textContent = '错误：' + e.message; }
        }
        </script>
        </div>
        <div style="margin:24px 0;text-align:center;">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1625872903750578" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </main>
    <footer style="text-align:center;padding:20px;color:#999;font-size:13px;">
        <a href="../sitemap.xml" style="color:#6366f1;">站点地图</a> |
        <a href="../index.html" style="color:#6366f1;">返回首页</a>
    </footer>
</body>
</html>
