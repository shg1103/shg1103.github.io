<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container">
        <div class="tool-page">
            <h1>&#128202; JSON/CSV互转</h1>
            
        <textarea id="jcInput" placeholder="输入JSON数组，如：[{\"name\":\"Alice\",\"age\":30}]"></textarea>
        <div style="display:flex;gap:10px;margin-top:12px;">
          <button onclick="jsonToCsv()">JSON → CSV</button>
          <button onclick="csvToJson()" style="background:#888;">CSV → JSON</button>
        </div>
        <pre id="jcOutput">结果将显示在这里</pre>
        <script>
        function jsonToCsv() {
          try {
            const arr = JSON.parse(document.getElementById('jcInput').value);
            if (!Array.isArray(arr)||!arr.length) { document.getElementById('jcOutput').textContent = '请输入非空JSON数组'; return; }
            const keys = Object.keys(arr[0]);
            let csv = keys.join(',') + '\n';
            arr.forEach(row => { csv += keys.map(k => '"' + String(row[k]??'').replace(/"/g,'""') + '"').join(',') + '\n'; });
            document.getElementById('jcOutput').textContent = csv;
          } catch(e) { document.getElementById('jcOutput').textContent = '错误：' + e.message; }
        }
        function csvToJson() {
          try {
            const text = document.getElementById('jcInput').value.trim();
            const lines = text.split('\n');
            const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g,''));
            const result = lines.slice(1).filter(l=>l.trim()).map(line => {
              const vals = line.split(',').map(v => v.replace(/^"|"$/g,''));
              const obj = {}; headers.forEach((h,i) => obj[h] = vals[i]??''); return obj;
            });
            document.getElementById('jcOutput').textContent = JSON.stringify(result, null, 2);
          } catch(e) { document.getElementById('jcOutput').textContent = '错误：' + e.message; }
        }
        </script>
