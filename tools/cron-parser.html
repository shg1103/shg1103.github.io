<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container">
        <div class="tool-page">
            <h1>&#9200; Cron表达式解析器</h1>
            
        <textarea id="cronInput" placeholder="输入Cron表达式，如：*/5 * * * *"></textarea>
        <button onclick="parseCron()">解析</button>
        <pre id="cronOutput">结果将显示在这里</pre>
        <script>
        function parseCron() {
          const v = document.getElementById('cronInput').value.trim();
          if (!v) return;
          const parts = v.split(/\s+/);
          if (parts.length < 5) { document.getElementById('cronOutput').textContent = '格式错误：需要至少5个字段'; return; }
          let r = 'Cron表达式：' + v + '\n\n解析结果：\n';
          r += '分钟：' + parts[0] + '\n';
          r += '小时：' + parts[1] + '\n';
          r += '日：' + parts[2] + '\n';
          r += '月：' + parts[3] + '\n';
          r += '星期：' + parts[4] + '\n';
          document.getElementById('cronOutput').textContent = r;
        }
        </script>
