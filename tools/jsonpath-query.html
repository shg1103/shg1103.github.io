<script>
function runJP(){
    var dataStr=document.getElementById('jpData').value;var expr=document.getElementById('jpExpr').value.trim();
    var out=document.getElementById('jpResult');
    try{var data=JSON.parse(dataStr);}catch(e){out.value='JSON 解析错误: '+e.message;return;}
    try{
        var result=jsonPath(data,expr);
        out.value=result!==null&&result!==undefined?JSON.stringify(result,null,2):'(空结果)';
    }catch(e){out.value='JSONPath 查询错误: '+e.message;}
}
function jsonPath(obj,expr){
    if(!expr||expr==='$')return obj;
    var path=expr.replace(/^\$[\.]?/,'').split('.');
    var current=obj;
    for(var i=0;i<path.length;i++){
        var p=path[i];var matches=p.match(/^(.+?)\[(.+?)\]$/);
        if(matches){
            var name=matches[1];var idx=matches[2];
            if(name)current=current[name];
            if(idx==='*'){var arr=[];for(var k in current)arr.push(current[k]);current=arr;}
            else{var indexes=idx.split(',');if(indexes.length>1){var arr=[];for(var n=0;n<indexes.length;n++)arr.push(current[parseInt(indexes[n])]);current=arr;}else{current=current[parseInt(idx)];}}
        }else if(p==='*'){var arr=[];for(var k in current)arr.push(current[k]);current=arr;}
        else if(p==='..'){current=collectDeep(current);}
        else{current=current?current[p]:undefined;}
        if(current===undefined||current===null)return null;
    }
    return current;
}
function collectDeep(obj){
    var result=[];
    function walk(o){
        if(Array.isArray(o)){o.forEach(function(item){result.push(item);if(typeof item==='object')walk(item);});}
        else if(typeof o==='object'&&o!==null){for(var k in o){result.push(o[k]);if(typeof o[k]==='object')walk(o[k]);}}
    }
    walk(obj);
    return result;
}
function loadJPSample(){
    document.getElementById('jpData').value=JSON.stringify({"store":{"book":[{"title":"Book A","price":8.95,"category":"fiction"},{"title":"Book B","price":12.99,"category":"non-fiction"},{"title":"Book C","price":5.50,"category":"fiction"}],"bicycle":{"color":"red","price":19.95}}},null,2);
    document.getElementById('jpExpr').value='$.store.book[*].title';
}
