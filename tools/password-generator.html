            <h1>&#128272; 随机密码生成器</h1>
            <div style="max-width:600px;">
<div style="background:#f8f8f8;border-radius:12px;padding:20px;margin-bottom:20px;">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
    <input type="text" id="pwdOutput" readonly style="flex:1;font-size:18px;font-family:monospace;font-weight:600;letter-spacing:1px;background:#fff;" placeholder="点击生成密码">
    <button onclick="copyPwd()" style="padding:10px 16px;font-size:13px;">复制</button>
  </div>
  <div id="strengthBar" style="height:6px;border-radius:3px;background:#e8e8e8;overflow:hidden;margin-bottom:8px;">
    <div id="strengthFill" style="height:100%;width:0%;transition:width .3s,background .3s;border-radius:3px;"></div>
  </div>
  <div id="strengthText" style="font-size:12px;color:#888;text-align:center;">-</div>
</div>
<div style="margin-bottom:16px;">
  <label style="font-weight:600;font-size:13px;display:block;margin-bottom:8px;">长度: <span id="lenVal">16</span></label>
  <input type="range" id="pwdLen" min="6" max="64" value="16" style="width:100%;" oninput="document.getElementById('lenVal').textContent=this.value;genPwd()">
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;">
  <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;"><input type="checkbox" id="useUpper" checked> 大写字母 (A-Z)</label>
  <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;"><input type="checkbox" id="useLower" checked> 小写字母 (a-z)</label>
  <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;"><input type="checkbox" id="useNum" checked> 数字 (0-9)</label>
  <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;"><input type="checkbox" id="useSym" checked> 符号 (!@#$...)</label>
  <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;"><input type="checkbox" id="noAmb"> 排除歧义字符 (0,O,l,1)</label>
</div>
<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
  <button onclick="genPwd()">重新生成</button>
  <button onclick="genBatch()" style="background:#10b981;">批量生成 10 个</button>
</div>
<div id="batchOut" style="display:none;">
  <h3 style="font-size:14px;font-weight:600;margin-bottom:10px;">批量生成结果</h3>
  <div id="batchList"></div>
</div>
</div>
<script>
function genPwd(){
  const len=parseInt(document.getElementById('pwdLen').value);
  let chars='';
  const AMB='0O1lI';
  const noAmb=document.getElementById('noAmb').checked;
  if(document.getElementById('useUpper').checked) chars+=(noAmb?'ABCDEFGHJKMNPQRSTUVWXYZ':'ABCDEFGHIJKLMNOPQRSTUVWXYZ');
  if(document.getElementById('useLower').checked) chars+=(noAmb?'abcdefghjkmnpqrstuvwxyz':'abcdefghijklmnopqrstuvwxyz');
  if(document.getElementById('useNum').checked) chars+=(noAmb?'23456789':'0123456789');
  if(document.getElementById('useSym').checked) chars+='!@#$%^&*()-_=+[]{}|;:,.<>?';
  if(!chars){alert('请至少选择一种字符类型');return;}
  let pwd='';
  const arr=new Uint32Array(len);
  crypto.getRandomValues(arr);
  for(let i=0;i<len;i++) pwd+=chars[arr[i]%chars.length];
  document.getElementById('pwdOutput').value=pwd;
  updateStrength(pwd);
  return pwd;
}
function updateStrength(pwd){
  let score=0;
  if(pwd.length>=8)score++;if(pwd.length>=12)score++;if(pwd.length>=16)score++;
  if(/[A-Z]/.test(pwd))score++;if(/[a-z]/.test(pwd))score++;
  if(/[0-9]/.test(pwd))score++;if(/[^A-Za-z0-9]/.test(pwd))score++;
  const pct=Math.round((score/7)*100);
  const colors=['#e74c3c','#e74c3c','#f39c12','#f39c12','#27ae60','#27ae60','#10b981','#10b981'];
  const labels=['极弱','很弱','弱','中等','良好','强','很强','极强'];
  document.getElementById('strengthFill').style.width=pct+'%';
  document.getElementById('strengthFill').style.background=colors[score-1]||'#e8e8e8';
  document.getElementById('strengthText').textContent='密码强度: '+(labels[score-1]||'-');
}
function copyPwd(){const v=document.getElementById('pwdOutput').value;if(!v)return;navigator.clipboard.writeText(v).then(()=>{const b=event.target;const old=b.textContent;b.textContent='已复制!';setTimeout(()=>b.textContent=old,1500);});}
function genBatch(){
  const list=[];for(let i=0;i<10;i++)list.push(genPwd());
  document.getElementById('batchList').innerHTML=list.map((p,i)=>'<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span style="color:#888;font-size:12px;width:20px;">'+(i+1)+'.</span><input type=text value="'+p+'" readonly style="flex:1;font-family:monospace;font-size:13px;background:#f8f8f8;"><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)" style="padding:6px 10px;font-size:12px;">复制</button></div>').join('');
  document.getElementById('batchOut').style.display='block';
}
genPwd();
</script>
