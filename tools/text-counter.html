            <h1>&#128209; 文字统计工具</h1>
            <div>
<div style="margin-bottom:16px;">
  <label style="font-weight:600;display:block;margin-bottom:8px;">输入文本</label>
  <textarea id="textIn" placeholder="在此输入或粘贴文本，实时统计..." style="min-height:220px;font-size:14px;" oninput="countText()"></textarea>
</div>
<div id="stats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:20px;">
  <div style="background:#f0f2f5;border-radius:10px;padding:16px;text-align:center;">
    <div id="charCount" style="font-size:28px;font-weight:700;color:#6366f1;">0</div>
    <div style="font-size:12px;color:#888;margin-top:4px;">字符数</div>
  </div>
  <div style="background:#f0f2f5;border-radius:10px;padding:16px;text-align:center;">
    <div id="charNoSpace" style="font-size:28px;font-weight:700;color:#6366f1;">0</div>
    <div style="font-size:12px;color:#888;margin-top:4px;">字符数(不含空格)</div>
  </div>
  <div style="background:#f0f2f5;border-radius:10px;padding:16px;text-align:center;">
    <div id="wordCount" style="font-size:28px;font-weight:700;color:#10b981;">0</div>
    <div style="font-size:12px;color:#888;margin-top:4px;">单词/词数</div>
  </div>
  <div style="background:#f0f2f5;border-radius:10px;padding:16px;text-align:center;">
    <div id="cnCount" style="font-size:28px;font-weight:700;color:#f59e0b;">0</div>
    <div style="font-size:12px;color:#888;margin-top:4px;">中文字数</div>
  </div>
  <div style="background:#f0f2f5;border-radius:10px;padding:16px;text-align:center;">
    <div id="lineCount" style="font-size:28px;font-weight:700;color:#8b5cf6;">0</div>
    <div style="font-size:12px;color:#888;margin-top:4px;">行数</div>
  </div>
  <div style="background:#f0f2f5;border-radius:10px;padding:16px;text-align:center;">
    <div id="paraCount" style="font-size:28px;font-weight:700;color:#ec4899;">0</div>
    <div style="font-size:12px;color:#888;margin-top:4px;">段落数</div>
  </div>
  <div style="background:#f0f2f5;border-radius:10px;padding:16px;text-align:center;">
    <div id="readTime" style="font-size:28px;font-weight:700;color:#14b8a6;">0</div>
    <div style="font-size:12px;color:#888;margin-top:4px;">预计阅读(秒)</div>
  </div>
  <div style="background:#f0f2f5;border-radius:10px;padding:16px;text-align:center;">
    <div id="byteCount" style="font-size:28px;font-weight:700;color:#6b7280;">0</div>
    <div style="font-size:12px;color:#888;margin-top:4px;">字节数(UTF-8)</div>
  </div>
</div>
<button onclick="document.getElementById('textIn').value='';countText();" style="background:#6b7280;">清空</button>
</div>
<script>
function countText(){
  const t=document.getElementById('textIn').value;
  const chars=t.length;
  const noSpace=t.replace(/\s/g,'').length;
  const cnChars=(t.match(/[一-龥]/g)||[]).length;
  const words=t.trim()===''?0:t.trim().split(/\s+/).length;
  const lines=t===''?0:t.split('
').length;
  const paras=t.trim()===''?0:t.trim().split(/
\s*
/).length;
  const bytes=new TextEncoder().encode(t).length;
  const readSec=Math.round((cnChars+(words*5))/300*60);
  document.getElementById('charCount').textContent=chars;
  document.getElementById('charNoSpace').textContent=noSpace;
  document.getElementById('wordCount').textContent=words;
  document.getElementById('cnCount').textContent=cnChars;
  document.getElementById('lineCount').textContent=lines;
  document.getElementById('paraCount').textContent=paras;
  document.getElementById('readTime').textContent=readSec<60?readSec+'s':Math.round(readSec/60)+'min';
  document.getElementById('byteCount').textContent=bytes;
}
</script>
