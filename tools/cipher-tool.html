<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container tool-page">
        <h1>文本加密工具</h1>
        <p style="color:#666;margin-bottom:20px;">ROT13/凯撒/Atbash/文本反转加解密</p>
        <div class="tool-body">
            <div class="tool-ui">
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="tool-btn active" onclick="setMode('rot13')">ROT13</button>
        <button class="tool-btn" onclick="setMode('caesar')">凯撒密码</button>
        <button class="tool-btn" onclick="setMode('atbash')">Atbash</button>
        <button class="tool-btn" onclick="setMode('reverse')">文本反转</button>
    </div>
    <textarea id="cipherInput" placeholder="输入要加密/解密的文本..." style="width:100%%;height:150px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;resize:vertical;"></textarea>
    <div style="display:flex;gap:10px;margin:10px 0;align-items:center;flex-wrap:wrap;">
        <label style="font-size:13px;color:#666;">
            凯撒偏移:
            <input type="number" id="caesarShift" value="3" min="1" max="25" style="width:60px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;">
        </label>
        <button class="tool-btn" onclick="process()">执行</button>
        <button class="tool-btn" onclick="swapIo()">交换</button>
        <button class="tool-btn" onclick="copyResult()">复制结果</button>
    </div>
    <textarea id="cipherOutput" readonly placeholder="输出结果..." style="width:100%%;height:150px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;background:#f9f9f9;resize:vertical;"></textarea>
</div>
<script>
let cm='rot13';
function setMode(m){cm=m;document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');}
function shiftChar(c,shift){const a=c>='a'&&c<='z'?'a'.charCodeAt(0):c>='A'&&c<='Z'?'A'.charCodeAt(0):-1;if(a===-1)return c;return String.fromCharCode((c.charCodeAt(0)-a+shift+26)%%26+a);}
function process(){
    const inp=document.getElementById('cipherInput').value;
    let out='';
    if(cm==='rot13'){out=[...inp].map(c=>shiftChar(c,13)).join('');}
    else if(cm==='caesar'){const s=parseInt(document.getElementById('caesarShift').value)||3;out=[...inp].map(c=>shiftChar(c,s)).join('');}
    else if(cm==='atbash'){out=[...inp].map(c=>{const a=c>='a'&&c<='z'?'a'.charCodeAt(0):c>='A'&&c<='Z'?'A'.charCodeAt(0):-1;if(a===-1)return c;return String.fromCharCode(a+25-(c.charCodeAt(0)-a));}).join('');}
    else if(cm==='reverse'){out=[...inp].reverse().join('');}
    document.getElementById('cipherOutput').value=out;
}
function swapIo(){const i=document.getElementById('cipherInput'),o=document.getElementById('cipherOutput');const t=i.value;i.value=o.value;o.value=t;}
function copyResult(){const v=document.getElementById('cipherOutput').value;if(!v)return;navigator.clipboard.writeText(v).then(()=>alert('已复制!'));}
</script>
