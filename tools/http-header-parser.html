n><button class="tool-btn" onclick="loadHHS()">Sample</button></div><div id="hhR"></div></div><script>function parseHH(){var t=document.getElementById("hhIn").value;var lines=t.split(String.fromCharCode(10));var hs=[];for(var i=0;i<lines.length;i++){var l=lines[i].trim();if(!l)continue;var idx=l.indexOf(":");if(idx>0)hs.push({k:l.substring(0,idx).trim(),v:l.substring(idx+1).trim()});}if(!hs.length){document.getElementById("hhR").innerHTML="<div style=color:#999;>no headers</div>";return;}var kn={};kn["content-type"]="response body type";kn["content-length"]="body size(bytes)";kn["cache-control"]="cache policy";kn["user-agent"]="client identity";kn["authorization"]="credentials";kn["host"]="target host";kn["origin"]="request origin";kn["referer"]="referrer URL";kn["set-cookie"]="set cookie";kn["location"]="redirect URL";kn["server"]="server info";var h="<table style=width:100%;border-collapse:collapse;font-size:12px;><tr style=background:#f0f4ff;><th style=padding:6px;border:1px solid #ddd;>header</th><th style=padding:6px;border:1px solid #ddd;>value</th><th style=padding:6px;border:1px solid #ddd;>note</th></tr>";hs.forEach(function(x){h+="<tr><td style=padding:4px 6px;border:1px solid #ddd;font-family:monospace;color:#6366f1;>"+x.k+"</td><td style=padding:4px 6px;border:1px solid #ddd;font-family:monospace;font-size:11px;>"+x.v+"</td><td style=padding:4px 6px;border:1px solid #ddd;font-size:11px;color:#888;>"+(kn[x.k.toLowerCase()]||"")+"</td></tr>";});h+="</table>";document.getElementById("hhR").innerHTML=h;}function loadHHS(){document.getElementById("hhIn").value="Host: example.com\nUser-Agent: Mozilla/5.0\nAccept: text/html\nCache-Control: no-cache";parseHH();}</script></div><div style="margin:24px 0;text-align:center;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1625872903750578" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div></main></body></html>
