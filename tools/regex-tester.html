<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container">
        <div class="tool-page">
            <h1>&#128269; 正则表达式测试器</h1>
            
        <input type="text" id="regexInput" placeholder="输入正则表达式，如：\d+" style="font-family:monospace;">
        <textarea id="regexText" placeholder="输入测试文本..."></textarea>
        <button onclick="testRegex()">测试匹配</button>
        <pre id="regexOutput">匹配结果将显示在这里</pre>
        <script>
        function testRegex() {
          try {
            const re = new RegExp(document.getElementById('regexInput').value, 'g');
            const text = document.getElementById('regexText').value;
            const matches = [...text.matchAll(re)];
            let r = '匹配到 ' + matches.length + ' 处：\n';
            matches.forEach((m,i) => r += (i+1) + '. 「' + m[0] + '」 位置：' + m.index + '\n');
            if (matches.length===0) r = '没有匹配结果';
            document.getElementById('regexOutput').textContent = r;
          } catch(e) { document.getElementById('regexOutput').textContent = '正则错误：' + e.message; }
        }
        </script>
