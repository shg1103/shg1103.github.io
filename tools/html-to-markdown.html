<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container tool-page">
        <h1>HTML 转 Markdown</h1>
        <p style="color:#666;margin-bottom:20px;">HTML代码一键转为Markdown格式</p>
        <div class="tool-body"><div class="tool-ui">
    <textarea id="htmInput" placeholder="粘贴HTML代码..." style="width:100%;height:180px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;resize:vertical;"></textarea>
    <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;">
        <button class="tool-btn" onclick="convertHtml()">转换</button>
        <button class="tool-btn" onclick="document.getElementById('htmInput').value='<h1>示例标题</h1><p>这是一个<strong>测试</strong>段落</p>'">加载示例</button>
        <button class="tool-btn" onclick="copyEl('htmOutput')">复制结果</button>
    </div>
    <textarea id="htmOutput" readonly placeholder="Markdown输出..." style="width:100%;height:180px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;background:#f9f9f9;resize:vertical;"></textarea>
</div>
<script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
<script>
function convertHtml(){
    var inp=document.getElementById('htmInput').value;var out=document.getElementById('htmOutput');
    if(!inp){out.value='';return;}
    try{var turndownService=new TurndownService({headingStyle:'atx',codeBlockStyle:'fenced'});out.value=turndownService.turndown(inp);}
    catch(e){out.value='转换失败: '+e.message;}
}
function copyEl(id){var v=document.getElementById(id).value;if(!v)return;navigator.clipboard.writeText(v).then(function(){alert('已复制!');});}
</script></div>
