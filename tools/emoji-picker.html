};
var _emoCat='smileys';
function showEmoji(cat){_emoCat=cat;document.querySelectorAll('.tool-btn').forEach(function(b){b.classList.remove('active');});event.target.classList.add('active');renderEmoji(cat);}
function renderEmoji(cat){
    var grid=document.getElementById('emoGrid');var search=document.getElementById('emoSearch').value.trim().toLowerCase();
    var emojis=EMOJIS[cat]||[];var filtered=search?emojis.filter(function(e){return e.includes(search);}):emojis;
    grid.innerHTML=filtered.map(function(e){return '<div style="font-size:28px;text-align:center;padding:4px;cursor:pointer;border-radius:6px;transition:background .15s;" onmouseover="this.style.background='#eef2ff'" onmouseout="this.style.background=''" onclick="copyEmoji(\''+e+'\')" title="点击复制">'+e+'</div>';}).join('');
    document.getElementById('emoCount').textContent='共 '+filtered.length+' 个Emoji';
}
function filterEmoji(){renderEmoji(_emoCat);}
function copyEmoji(e){navigator.clipboard.writeText(e).then(function(){var t=event.target;var ot=t.innerHTML;t.innerHTML='<span style="font-size:14px;">✅</span>';setTimeout(function(){t.innerHTML=ot;},800);});}
showEmoji('smileys');
