<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container tool-page">
        <h1>文本去重排序</h1>
        <p style="color:#666;margin-bottom:20px;">去重、排序、计数、过滤，一行搞定</p>
        <div class="tool-body"><div class="tool-ui">
    <textarea id="ddInput" placeholder="每行一条数据，粘贴进来..." style="width:100%;height:150px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;resize:vertical;"></textarea>
    <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center;">
        <button class="tool-btn" onclick="dedup('asc')">去重+升序</button>
        <button class="tool-btn" onclick="dedup('desc')">去重+降序</button>
        <button class="tool-btn" onclick="dedup('count_asc')">按次数升序</button>
        <button class="tool-btn" onclick="dedup('count_desc')">按次数降序</button>
        <button class="tool-btn" onclick="dedup('only')">仅去重</button>
        <label><input type="checkbox" id="ddTrim" checked> 去空格</label>
        <label><input type="checkbox" id="ddEmpty" checked> 去空行</label>
    </div>
    <textarea id="ddOutput" readonly placeholder="输出结果..." style="width:100%;height:200px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:13px;background:#f9f9f9;resize:vertical;"></textarea>
    <div style="display:flex;gap:12px;margin-top:8px;font-size:12px;color:#888;">
        <span id="ddStats"></span>
        <button class="tool-btn" onclick="copyEl('ddOutput')">复制结果</button>
    </div>
</div>
<script>
function dedup(mode){
    var inp=document.getElementById('ddInput').value;var out=document.getElementById('ddOutput');var stats=document.getElementById('ddStats');
    var lines=inp.split('\n');
    if(document.getElementById('ddTrim').checked) lines=lines.map(function(l){return l.trim();});
    if(document.getElementById('ddEmpty').checked) lines=lines.filter(function(l){return l!=='';});
    var count={};lines.forEach(function(l){count[l]=(count[l]||0)+1;});
    var unique=Object.keys(count);
    if(mode==='asc') unique.sort();
    else if(mode==='desc') unique.sort().reverse();
    else if(mode==='count_asc') unique.sort(function(a,b){return count[a]-count[b];});
    else if(mode==='count_desc') unique.sort(function(a,b){return count[b]-count[a];});
    var result='';
    if(mode==='only'){unique.forEach(function(l){result+=l+'\n';});}
    else if(mode==='count_asc'||mode==='count_desc'){unique.forEach(function(l){result+=l+' ('+count[l]+'次)\n';});}
    else{unique.forEach(function(l){result+=l+'\n';});}
    out.value=result;
    stats.textContent='原始: '+lines.length+'行 | 去重后: '+unique.length+'行 | 总字符: '+result.length;
}
function copyEl(id){var v=document.getElementById(id).value;if(!v)return;navigator.clipboard.writeText(v).then(function(){alert('已复制!');});}
</script></div>
