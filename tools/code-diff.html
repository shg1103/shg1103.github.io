<body>
    <header><div class="container"><a href="../index.html" class="logo">DevTools 工具站</a></div></header>
    <main class="container tool-page">
        <h1>代码差异对比</h1>
        <p style="color:#666;margin-bottom:20px;">左右并排对比两段文本差异，三色高亮</p>
        <div class="tool-body"><div class="tool-ui">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
        <div><label style="font-weight:600;font-size:13px;">原始文本 (A)</label>
        <textarea id="diffA" placeholder="原始版本..." style="width:100%;height:150px;padding:8px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:12px;resize:vertical;"></textarea></div>
        <div><label style="font-weight:600;font-size:13px;">新文本 (B)</label>
        <textarea id="diffB" placeholder="新版本..." style="width:100%;height:150px;padding:8px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:12px;resize:vertical;"></textarea></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="tool-btn" onclick="runDiff()">对比差异</button>
        <button class="tool-btn" onclick="document.getElementById('diffOut').innerHTML='<div style=color:#999>点击「对比差异」查看结果</div>'">清空</button>
    </div>
    <div id="diffOut" style="border:1px solid #ddd;border-radius:6px;padding:10px;font-family:monospace;font-size:12px;line-height:1.6;background:#fafafa;min-height:100px;overflow-x:auto;white-space:nowrap;">
        <div style="color:#999;">点击「对比差异」查看结果</div>
    </div>
</div>
<script>
function runDiff(){
    var a=document.getElementById('diffA').value.split('\n');var b=document.getElementById('diffB').value.split('\n');
    var out=document.getElementById('diffOut');var html='';
    var max=Math.max(a.length,b.length);var add=0,del=0,eq=0;
    for(var i=0;i<max;i++){
        var la=a[i]||'',lb=b[i]||'';
        var escapedA=la.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        var escapedB=lb.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        if(la!==lb){
            if(la!==''&&lb===''){html+='<div style="background:#ffe0e0;padding:1px 6px;color:#c00;">- '+escapedA+'</div>';del++;}
            else if(la===''&&lb!==''){html+='<div style="background:#e0ffe0;padding:1px 6px;color:#0a0;">+ '+escapedB+'</div>';add++;}
            else{html+='<div style="background:#fff8e0;padding:1px 6px;color:#960;">~ <span style="text-decoration:line-through;color:#c00;">'+escapedA+'</span> | <span style="color:#0a0;">'+escapedB+'</span></div>';add++;del++;}
        }else{html+='<div style="padding:1px 6px;color:#555;">  '+escapedA+'</div>';eq++;}
    }
    html='<div style="margin-bottom:8px;font-size:11px;color:#888;">相同: '+eq+' | 新增: '+add+' | 删除: '+del+' | 共 '+(add+del+eq)+' 行</div>'+html;
    out.innerHTML=html;
}
</script></div>
