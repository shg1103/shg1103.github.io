nt-family:monospace;font-size:13px;resize:vertical;"></textarea><div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;"><button class="tool-btn" onclick="jsonToTS()">转换</button><button class="tool-btn" onclick="loadJTSSample()">加载示例</button><button class="tool-btn" onclick="copyEl('jtsOutput')">复制结果</button></div><textarea id="jtsOutput" readonly placeholder="生成的 TypeScript 接口定义..." style="width:100%;height:250px;padding:10px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:12px;background:#f9f9f9;resize:vertical;"></textarea><div id="jtsErr" style="color:#e53e3e;margin-top:6px;display:none;"></div></div><script>function jsonToTS(){var inp=document.getElementById("jtsInput").value;var out=document.getElementById("jtsOutput");var err=document.getElementById("jtsErr");err.style.display="none";try{var data=JSON.parse(inp);var result=inferType("Root",data,0);out.value=result;}catch(e){err.textContent="JSON 解析错误: "+e.message;err.style.display="block";}}function inferType(name,val,depth){var indent=Array(depth*2+1).join(" ");if(val===null)return indent+name+": null;";if(Array.isArray(val)){if(val.length===0)return indent+name+": any[];";var types={};for(var i=0;i<val.length;i++){var t=typeof val[i];if(val[i]!==null&&typeof val[i]==="object"&&!Array.isArray(val[i]))t="object";types[t]=true;}var typeStr=Object.keys(types).join(" | ");if(types["object"]){var items={};for(var i=0;i<Math.min(val.length,5);i++){if(typeof val[i]==="object"&&val[i]!==null){for(var k in val[i]){if(!items[k])items[k]=val[i][k];}}}return indent+"interface "+name+"Item {\n"+inferObject(items,name+"Item",depth+1)+"\n"+indent+"}\n"+indent+"type "+name+" = "+name+"Item[];";}return indent+"type "+name+" = "+typeStr+"[];";}if(typeof val==="object"){return indent+"interface "+name+" {\n"+inferObject(val,name,depth+1)+"\n"+indent+"}";}if(typeof val==="string")return indent+name+": string;";if(typeof val==="number")return indent+name+": number;";if(typeof val==="boolean")return indent+name+": boolean;";return indent+name+": any;";}function inferObject(obj,name,depth){var indent=Array(depth*2+1).join(" ");var lines=[];for(var k in obj){var v=obj[k];var propName=/^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k)?k:"+k+";lines.push(inferType(propName,v,depth));}return lines.join("\n");}function loadJTSSample(){document.getElementById("jtsInput").value=JSON.stringify({name:"Alice",age:30,email:"alice@example.com",address:{city:"Beijing",zip:"100000"},tags:["admin","user"],active:true},null,2);}function copyEl(id){var v=document.getElementById(id).value;if(!v)return;navigator.clipboard.writeText(v);}</script></div><div style="margin:24px 0;text-align:center;"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1625872903750578" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div></main></body></html>
